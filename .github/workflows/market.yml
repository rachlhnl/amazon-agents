name: Market tracker

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 6am Pacific (5am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Collect and build
        env:
          # Optional: with these set, Amazon price and rank come from SP-API.
          SP_API_CLIENT_ID: ${{ secrets.SP_API_CLIENT_ID }}
          SP_API_CLIENT_SECRET: ${{ secrets.SP_API_CLIENT_SECRET }}
          SP_API_REFRESH_TOKEN: ${{ secrets.SP_API_REFRESH_TOKEN }}
        run: amz-agents market
      - name: Commit snapshot and dashboard
        run: |
          git config user.name "market-tracker[bot]"
          git config user.email "market-tracker@users.noreply.github.com"
          git add market/history market/index.html
          git diff --cached --quiet || git commit -m "Market snapshot $(date -u +%F)"
          git push
