# The CEO plan: changes leadership has decided on, in priority order.
#
# Every run, the chief of staff puts each item in the tracker as approved work for
# its team ("Your team to do"), above the agents' own suggestions, with a due date
# and a scorecard. Agent suggestions an item covers are merged into it. An agent
# drafts the first version of the work (with an Anthropic key, in Claude's words;
# without one, a starter outline from the evidence).
#
# Fields:
#   rank, title, team (key of TEAMS), effort (XS S M L XL), loe (in words), due_days
#   (from added)
#   gain_low / gain_high: estimated monthly profit gain, $ (assumptions in `why`)
#   kpi, baseline, target: the number that says it worked
#   measure: how the scorecard reads the KPI today (see amz_agents/plan.py), or
#            "manual" when only a person can check it
#   checks: mystery-shopper checks that should pass once it's done
#   covers: titles of agent suggestions this item replaces
#   draft: what the drafting agent writes, and drafter: which agent
#   added: date the item joined the plan

[[item]]
id = "sizing"
loe = "2–3 days"
rank = 1
added = "2026-10-20"
title = "One clear sizing step on every channel"
team = "product"
effort = "S"
due_days = 7
gain_low = 1500
gain_high = 2500
why = "Size buttons read \"XS(Men) / S(Women)\" and the size guide says women should size down, so careful shoppers size down twice; 70% of the best seller's 1-2 star reviews are about fit. Gain is mostly fewer Amazon returns (est. $100k/mo on Amazon, 12% returns, half fit-driven, cut by a fifth) plus 2-5% more conversion."
kpi = "Share of 1-2★ reviews about fit (Best Seller Unisex Sets, last 12 months)"
baseline = "70%"
target = "≤ 35%"
measure = "fit_share:Best Seller Unisex"
checks = ["model"]
steps = [
  "Decide one system: unisex sizes with a women's conversion table, or the dual labels without the size-down note.",
  "Put the size chart as text next to the size buttons on every product page.",
  "Add the model's height and size to every product page.",
  "Use the same chart as the second image on Amazon and Walmart listings.",
]
covers = ["dagacci.com: make sizing one clear step", "dagacci.com: nothing to help me pick a size",
          "dagacci.com: no model height or size to compare against",
          "Best Seller Unisex Scrub Sets: buyers complain about fit & sizing"]
drafter = "product"
draft = "A one-page sizing decision memo: the problem in shoppers' words, the two options with pros and cons, a recommendation, and the exact size-chart text to publish."

