# Dagacci deal calendar, Nov 2026 – Oct 2027. Read by the promotions agent every run, and
# the source of the calendar on the Dagacci HQ page.
#
# One entry per platform per occasion: `group` ties them together (Amazon, Walmart and
# dagacci.com versions of Black Friday are three entries).
#
# Black Friday, Cyber Monday and the fixed observances (Nurses Week, Doctors' Day) have
# known dates. Amazon and Walmart haven't announced 2027 event dates, so those are
# placeholders. Fees and discount rules come from seller guides, not the channels' own
# pages, so every entry stays `confirmed = false` until someone checks it on Amazon's deal
# screen or in Walmart Seller Center.
#
# Fields:
#   group, name, channel (amazon | walmart | shopify = dagacci.com), starts, ends
#   submit_by + deadline: whose date it is (amazon | walmart = the platform's cutoff;
#     ours = our own lead time to set it up)
#   hold_days: price hold before the event (Amazon's price-history rule)
#   deal_type, min_discount (vs the recent selling price), discount_proposed (true until
#     the team sets it), below_30d_low
#   upfront_fee, pct_fee, fee_cap, fee_basis (per_deal = each parent style is a deal |
#     per_campaign = one fee for the promotion | none | unknown)
#   alt_deal_type + alt_fee_basis: another way to run it, priced alongside
#   pick (best_sellers | overstock), skus, lift, confirmed, source, notes

