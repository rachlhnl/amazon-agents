    const right = el("div"); right.style.flex = "1"; right.style.minWidth = "260px";
    if (A.hero.spark.length > 1) {
      const pts = A.hero.spark, W = 600, H = 56, max = Math.max(...pts.map((p) => p[1]));
      const x = (i) => i / (pts.length - 1) * W, y = (v) => H - 4 - v / max * (H - 8);
      const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, preserveAspectRatio: "none", "aria-label": "Store reviews per quarter" });
      svg.append(svgEl("path", { d: pts.map((p, i) => (i ? "L" : "M") + x(i) + " " + y(p[1])).join(""), fill: "none", stroke: "var(--axis)", "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
      svg.append(svgEl("circle", { cx: x(pts.length - 1), cy: y(pts[pts.length - 1][1]), r: 4, fill: "var(--s1)" }));
      right.append(svg, el("div", "note", "Store reviews per quarter, last 3 years"));
    }
    h.append(left, right); card.append(h);
  }
  const ts = el("div", "tiles"); ts.style.marginTop = "18px";
  for (const t of A.tiles) {
    const k = el("div", "tile");
    k.append(el("div", "l", t.label), el("div", "v", t.value));
    if (t.note) k.append(el("div", "d", t.note));
    const d = deltaEl(t.delta); if (d) k.append(d);
    ts.append(k);
  }
  card.append(ts);
}

// --- insights & action plan -----------------------------------------------------
function insCard(r) {
  const c = el("div", "ins");
  const meta = el("div", "meta");
  meta.append(el("span", "pri p" + r.when, r.when_label), el("span", "tag", r.area), el("span", "tag", "Effort: " + r.effort));
  const h = el("h3");
  if (r.url) { const a = el("a", null, r.title); a.href = r.url; h.append(a); } else h.textContent = r.title;
  const see = el("p"); see.append(el("b", null, "What we see: "), document.createTextNode(r.see));
  const why = el("p"); why.append(el("b", null, "Why it matters: "), document.createTextNode(r.why));
  const ul = el("ul"); r.do.forEach((d) => ul.append(el("li", null, d)));
  c.append(meta, h, see, why, ul);
  if (r.kpi) {
    const k = el("div", "kpibox"); k.append(el("span", null, "Track: " + r.kpi));
    const nt = el("span"); nt.append(document.createTextNode("now "), el("b", null, r.now ?? "–"), document.createTextNode(" → target "), el("b", null, r.target ?? "–"));
    k.append(nt); c.append(k);
  }
  return c;
}
add(el("div", "section-title", "Insights & recommendations"));
{
  const card = add(el("div", "card s12"));
  card.append(el("h2", null, "Where to act first"), el("p", "intro",
    "Generated from today's data, so they update on every daily run. Each card says what the data shows, why it matters and what to do, and ends with the KPI to track and a target."));
  const g = el("div", "ins-grid");

  card.append(g);
}
{
  const card = add(el("div", "card s12"));
  card.append(el("h2", null, "Full action plan"), el("p", "sub", "Every recommendation, ranked. Click a row to jump to its section."));
  const t = el("table", "plan"); t.style.marginTop = "8px";
  const head = el("tr"); ["#", "When", "Recommendation", "Area", "Effort", "KPI to track", "Now", "Target"].forEach((h, i) => head.append(el("th", i >= 6 ? "n" : null, h)));
  const thead = el("thead"); thead.append(head); t.append(thead);
  const tb = el("tbody");

    const rc = el("td"); rc.append(el("div", "rt", r.title), el("div", "rs", r.do[0]));
    const w = el("td"); w.append(el("span", "pri p" + r.when, r.when_label));

// --- chart types -----------------------------------------------------------------
function bars(c) {
  const box = el("div", "rows");
  for (const r of c.rows) {
    const row = el("div", "row"); row.tabIndex = 0;
    const plot = el("div", "plot");
    if (r.parts) {
      let x = 0;
      for (const part of r.parts) {
        if (part.v <= 0) continue;
        const s = el("div", "seg"); s.style.left = x * 100 + "%"; s.style.width = part.v * 100 + "%";
        s.style.background = color(part.color); plot.append(s); x += part.v;
      }
    } else {
      if (r.track) { const t = el("div", "bar track"); t.style.width = "100%"; plot.append(t); }
      const b = el("div", "bar"); b.style.width = Math.max(r.value * 100, 0.6) + "%"; b.style.background = color(r.color); plot.append(b);
      if (r.tick) { const k = el("div", "tick"); k.style.left = `calc(${r.tick * 100}% - 1px)`; plot.append(k); }
    }
    const n = el("div", "name", r.name); n.title = r.name;
    row.append(n, plot, el("div", "val", r.label));
    hover(row, r.tip);
    box.append(row);
  }
  if (c.rows.length > 16) { const s = el("div", "scroll"); s.append(box); return s; }
  return box;
}

function lines(c) {
  const all = c.series.flatMap((s) => s.points);
  const dates = [...new Set(all.map((p) => p[0]))].sort();
  if (dates.length < 2) return el("div", "empty", "The line starts after the second daily run.");
  const W = 640, H = 220, L = 52, R = 96, T = 12, B = 26;
  const vals = all.map((p) => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (c.fmt === "rank" || c.fmt === "usd" || c.fmt === "pct") { const pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad; }
  else { lo = Math.min(0, lo); hi = hi * 1.05 || 1; }
  if (c.fmt === "pct") { lo = Math.max(0, lo); hi = Math.min(1, hi); }
  const t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]);
  const x = (d) => L + (Date.parse(d) - t0) / (t1 - t0) * (W - L - R);
  const inv = c.fmt === "rank";
  const y = (v) => inv ? T + (v - lo) / (hi - lo) * (H - T - B) : H - B - (v - lo) / (hi - lo) * (H - T - B);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": c.title });
  const f = F[c.fmt] || F.num;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = y(v);
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: yy, y2: yy, class: "gl" }));
    const t = svgEl("text", { x: L - 6, y: yy + 4, "text-anchor": "end" }); t.textContent = f(v); svg.append(t);
  }
  const long = t1 - t0 > 200 * 864e5;
  for (const d of [dates[0], dates[dates.length - 1]]) {
    const t = svgEl("text", { x: x(d), y: H - 6, "text-anchor": d === dates[0] ? "start" : "end" });
    t.textContent = new Date(d + "T12:00").toLocaleDateString(undefined, long ? { month: "short", year: "numeric" } : { month: "short", day: "numeric" }); svg.append(t);
  }
  for (const s of c.series) {
    if (!s.points.length) continue;
    svg.append(svgEl("path", { d: s.points.map((p, i) => (i ? "L" : "M") + x(p[0]) + " " + y(p[1])).join(""),
      fill: "none", stroke: color(s.color), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = s.points[s.points.length - 1];
    svg.append(svgEl("circle", { cx: x(last[0]), cy: y(last[1]), r: 4, fill: color(s.color), stroke: "var(--surface-1)", "stroke-width": 2 }));
    const t = svgEl("text", { x: x(last[0]) + 8, y: y(last[1]) + 4 }); t.textContent = f(last[1]) + " " + s.name; t.style.fill = "var(--text-secondary)"; svg.append(t);
  }
  const hit = svgEl("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
  const cross = svgEl("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross, hit);
  hit.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const d = dates.reduce((a, b) => Math.abs(x(b) - px) < Math.abs(x(a) - px) ? b : a);
    cross.setAttribute("x1", x(d)); cross.setAttribute("x2", x(d)); cross.setAttribute("visibility", "visible");
    showTip({ currentTarget: hit, clientX: e.clientX, clientY: e.clientY },
      [d, ...c.series.map((s) => { const p = s.points.find((q) => q[0] === d); return p ? `${s.name}: ${f(p[1])}` : null; })]);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  const wrap = el("div");
  if (c.series.length > 1) wrap.append(legend(c.series.map((s) => ({ label: s.name, kind: "line", color: s.color }))));
  wrap.append(svg);
  return wrap;
}

function dots(c) {
  const all = c.series.flatMap((s) => s.points.map((p) => p.x));
  if (!all.length) return el("div", "empty", "No prices could be read today.");
  const W = 640, rowH = 48, L = 80, R = 20, T = 8, H = T + rowH * c.series.length + 24;
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.08 || 2; lo = Math.max(0, lo - pad); hi += pad;
  const x = (v) => L + (v - lo) / (hi - lo) * (W - L - R);
  const f = F[c.fmt] || F.num;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": c.title });
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    svg.append(svgEl("line", { x1: x(v), x2: x(v), y1: T, y2: H - 22, class: "gl" }));
    const t = svgEl("text", { x: x(v), y: H - 6, "text-anchor": "middle" }); t.textContent = f(v); svg.append(t);
  }
  c.series.forEach((s, i) => {
    const cy = T + rowH * i + rowH / 2;
    const name = svgEl("text", { x: 0, y: cy + 4 }); name.textContent = s.name; name.style.fill = "var(--text-secondary)"; name.style.fontSize = "12px"; svg.append(name);
    const xs = s.points.map((p) => p.x).sort((a, b) => a - b);
    if (xs.length) {
      const m = xs[Math.floor((xs.length - 1) / 2)] / 2 + xs[Math.ceil((xs.length - 1) / 2)] / 2;
      svg.append(svgEl("line", { x1: x(m), x2: x(m), y1: cy - 16, y2: cy + 16, stroke: "var(--marker)", "stroke-width": 2 }));
    }
    s.points.forEach((p, j) => {
      const g = svgEl("circle", { cx: x(p.x), cy: cy + ((j % 3) - 1) * 7, r: 5, fill: color(s.color), stroke: "var(--surface-1)", "stroke-width": 2, tabindex: 0 });
      hover(g, p.tip); svg.append(g);
    });
  });
  const wrap = el("div");
  wrap.append(legend([...c.series.map((s) => ({ label: s.name, kind: "bar", color: s.color })), { label: "Median", kind: "tick" }]), svg);
  return wrap;
}

function table(c) {
  const t = el("table");
  let sortCol = c.sort ?? 0, dir = -1;
  const isNum = (col) => !!col.fmt;
  function draw() {
    const head = el("tr");
    c.columns.forEach((col, i) => {
      const th = el("th", isNum(col) ? "n" : null, col.label); th.tabIndex = 0;
      th.setAttribute("aria-sort", i === sortCol ? (dir > 0 ? "ascending" : "descending") : "none");
      const go = () => { dir = i === sortCol ? -dir : (isNum(col) ? -1 : 1); sortCol = i; draw(); t.tHead.rows[0].cells[i].focus({ preventScroll: true }); };
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      head.append(th);
    });
    // Rows are [name, url, ...values]; url may be null.
    const val = (r, i) => i === 0 ? r[0] : r[i + 1];
    const rows = [...c.rows].sort((a, b) => {
      const x = val(a, sortCol), y = val(b, sortCol);
      if (x == null) return 1; if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
    const body = rows.map((r) => {
      const tr = el("tr");
      c.columns.forEach((col, i) => {
        const td = el("td", isNum(col) ? "n" : col.wrap ? "wrap" : null);
        if (i === 0 && r[1]) { const a = el("a", null, r[0]); a.href = r[1]; td.append(a); }
        else { const v = val(r, i); td.textContent = col.fmt ? F[col.fmt](v) : (v ?? ""); }
        tr.append(td);
      });
      return tr;
    });
    t.replaceChildren(el("thead"), el("tbody"));
    t.tHead.append(head); t.tBodies[0].append(...body);
  }
  draw();
  const w = el("div", "tablewrap" + (c.rows.length > 14 ? " scroll" : "")); w.append(t); return w;
}

function quotes(c) {
  const ul = el("ul", "quotes");
  for (const q of c.items) {
    const li = el("li"); li.append(el("blockquote", null, q.text));
    const m = el("div", "qm");
    if (q.url) { const a = el("a", null, q.meta); a.href = q.url; m.append(a); } else m.textContent = q.meta;
    li.append(m); ul.append(li);
  }
  return ul;
}

const KINDS = { bars, stacked: bars, lines, dots, table, quotes, note: (c) => el("div", "empty", c.text) };

// "Show table" for bar charts: the same numbers without hovering.
function dataTable(c) {
  if (!c.rows || c.type === "table") return null;
  const d = el("details"); d.append(el("summary", null, "Show table"));
  const t = el("table"); const tb = el("tbody");
  for (const r of c.rows) {
    const tr = el("tr");
    tr.append(el("td", null, r.name), el("td", "n", r.label), el("td", null, r.tip[0]));
    tb.append(tr);
  }
  t.append(tb); d.append(t); return d;
}

function card(c) {
  const k = el("div", "card s" + c.span);
  k.append(el("h2", null, c.title), el("p", "sub", c.sub));
  if (c.legend) k.append(legend(c.legend));
  k.append(KINDS[c.type](c));
  if (c.read) { const r = el("div", "callout"); r.append(el("b", null, "What it means: "), document.createTextNode(c.read)); k.append(r); }
  const dt = dataTable(c); if (dt) k.append(dt);
  if (c.how) { const h = el("details", "how"); h.append(el("summary", null, "How to read this"), el("div", null, c.how)); k.append(h); }
  return k;
}

// --- numbered sections ----------------------------------------------------------
for (const s of A.sections) {
  const t = add(el("div", "section-title", `${s.num} · ${s.title}`)); t.id = "sec-" + s.id;
  add(el("p", "section-intro", s.intro));
  if (s.tiles.length) {
    const k = add(el("div", "card s12")); const ts = el("div", "tiles");
    for (const tl of s.tiles) {
      const x = el("div", "tile"); x.append(el("div", "l", tl.label));
      const p = el("div", "pair");
      for (const b of tl.pair) {
        const r = el("div"); const bn = el("span", "b"); const dt = el("i", "dot"); dt.style.background = color(b.color);
        bn.append(dt, document.createTextNode(b.brand)); r.append(bn, el("span", "v2", b.value));
        const d = deltaEl(b.delta); if (d) r.append(d);
        p.append(r);
      }
      x.append(p); if (tl.note) x.append(el("div", "d", tl.note)); ts.append(x);
    }
    k.append(ts);
  }
  s.charts.forEach((c) => add(card(c)));
  if (s.id === "trends") {
    const k = add(el("div", "card s12")); k.append(el("h2", null, "What changed since the last run"));
    if (s.changes.length) {
      const ul = el("ul", "changes"); ul.style.marginTop = "8px";
      for (const c of s.changes.slice(0, 60)) { const li = el("li"); li.append(el("span", "k", c.kind), document.createTextNode(c.text)); ul.append(li); }
      k.append(ul);
    } else k.append(el("p", "sub", A.days < 2 ? "Changes appear after the second daily run." : "Nothing changed in prices, stock, reviews or ranks."));
  }
  if (s.sowhat.length) {
    const k = add(el("div", "sowhat")); k.append(el("h2", null, "What this tells us · what to do"));
    for (const r of s.sowhat) {
      const row = el("div", "srow"); const l = el("div");
      l.append(el("div", "t", r.title), el("div", "f", r.fact));
      row.append(l, el("div", "a", r.action)); k.append(row);
    }
  }
}

$("footer").append(el("b", null, "About the data. "), document.createTextNode(
  "Everything here is public: each brand's own online store, Dagacci's store reviews, and Amazon product pages (read a few at a time; Amazon blocks some days, and blocked listings keep their last good values). " +
  "Sales, sessions and ad results aren't public; they're in the Seller Central dashboards." +
  (A.errors.length ? " Collection problems today: " + A.errors.join("; ") : "")));
